<style>
  :root{
    --green:#7E9373;
    --green-deep:#4E6245;
    --green-soft:#C6D1BD;
    --gold:#E7D8B6;
    --gold-deep:#A8894E;
    --paper:#FAF8F3;
    --ink:#27302A;
    --ink-soft:#535B52;
    --line:#E3E2D5;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;overflow-x:hidden;}
  body{background:var(--paper);color:var(--ink-soft);font-family:'Jost',sans-serif;font-weight:300;overflow-x:hidden;position:relative;}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:url('assets/papel.jpg');background-size:cover;opacity:.5;mix-blend-mode:multiply;}
  body.lock{overflow:hidden;}
  img{display:block;max-width:100%;}
  .mono{display:inline-block;background-color:var(--mc,var(--gold-deep));
    -webkit-mask:url('assets/monograma.png') center/contain no-repeat;mask:url('assets/monograma.png') center/contain no-repeat;
    aspect-ratio:810/737;width:74px;}
  .acc{position:absolute;background-size:contain;background-repeat:no-repeat;pointer-events:none;}
  .bg-euc{background-image:url('assets/eucalipto.webp');}
  .bg-leaf{background-image:url('assets/folha.webp');}

  .page{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 18px 60px;}

  /* header */
  header{position:relative;text-align:center;padding:54px 12px 10px;}
  .back{position:absolute;left:0;top:18px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--green-deep);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .back svg{width:13px;height:13px;}
  header .mono{width:78px;}
  .sec-label{font-size:10.5px;letter-spacing:.45em;text-transform:uppercase;color:var(--green-deep);text-indent:.45em;margin-top:22px;}
  h1{font-family:'Bodoni Moda',serif;font-weight:400;font-size:clamp(34px,9vw,52px);color:var(--ink);line-height:1.05;margin-top:10px;}
  h1 .it{font-style:italic;color:var(--gold-deep);}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px auto 0;max-width:230px;}
  .divider .ln{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold));}
  .divider .ln.r{background:linear-gradient(90deg,var(--gold),transparent);}
  .divider .dot{width:5px;height:5px;border:1px solid var(--gold-deep);transform:rotate(45deg);}
  .intro{font-size:13.5px;line-height:1.85;max-width:460px;margin:22px auto 0;}

  /* filtros */
  .tools{position:sticky;top:0;z-index:5;margin:30px -18px 22px;padding:12px 18px;background:rgba(250,248,243,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;}
  .chip{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--green-deep);background:transparent;border:1px solid var(--green-soft);border-radius:30px;padding:8px 15px;cursor:pointer;transition:.25s;}
  .chip.on{background:var(--green-deep);border-color:var(--green-deep);color:#fff;}
  .sort{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:30px;padding:8px 12px;cursor:pointer;}

  /* grade */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;}}
  @media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}}
  .card{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 14px 30px -24px rgba(39,48,42,.5);transition:transform .3s,box-shadow .3s;}
  .card:hover{transform:translateY(-3px);box-shadow:0 18px 34px -22px rgba(39,48,42,.55);}
  .pic{position:relative;aspect-ratio:1/1;overflow:hidden;background:#fff;}
  .pic img{width:100%;height:100%;object-fit:contain;padding:8px;}
  .pic.cover img{object-fit:cover;padding:0;}
  .pic.ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#F4F1E8,#ECEFE6);}
  .pic.ph .mono{width:46%;opacity:.55;}
  .body{padding:13px 12px 14px;text-align:center;display:flex;flex-direction:column;flex:1;}
  .name{font-family:'Bodoni Moda',serif;font-size:15.5px;line-height:1.3;color:var(--ink);flex:1;}
  .price{margin-top:8px;font-size:13px;letter-spacing:.06em;color:var(--gold-deep);font-weight:400;}
  .give{margin-top:11px;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-indent:.22em;color:#fff;background:var(--green-deep);border:1px solid var(--green-deep);padding:10px 8px;cursor:pointer;transition:.3s;}
  .give:hover{background:transparent;color:var(--green-deep);}

  footer{position:relative;z-index:1;text-align:center;padding:30px 20px 50px;}
  footer .mono{width:56px;}
  footer p{font-family:'Bodoni Moda',serif;font-size:24px;color:var(--ink);margin-top:14px;}
  footer p .amp{font-style:italic;color:var(--gold-deep);}

  /* modal */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(39,48,42,.45);}
  .modal.open{display:flex;}
  @media(min-width:640px){.modal{align-items:center;}}
  .sheet{position:relative;background:var(--paper);width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:30px 24px 26px;text-align:center;border-radius:18px 18px 0 0;animation:up .35s ease;}
  @media(min-width:640px){.sheet{border-radius:4px;}}
  .close{position:absolute;right:12px;top:10px;width:36px;height:36px;border:0;background:transparent;font-size:26px;line-height:1;color:var(--ink-soft);cursor:pointer;}
  .m-pic{width:120px;height:120px;margin:0 auto;border:1px solid var(--line);background:#fff;overflow:hidden;}
  .m-pic img{width:100%;height:100%;object-fit:contain;padding:6px;}
  .m-pic.cover img{object-fit:cover;padding:0;}
  .m-pic.ph{display:flex;align-items:center;justify-content:center;}
  .m-pic.ph .mono{width:60%;opacity:.55;}
  .m-name{font-family:'Bodoni Moda',serif;font-size:21px;color:var(--ink);margin-top:16px;line-height:1.25;}
  .m-price{font-family:'Bodoni Moda',serif;font-style:italic;font-size:22px;color:var(--gold-deep);margin-top:6px;}
  .m-step{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--green-deep);margin-top:24px;}
  .m-txt{font-size:13px;line-height:1.7;margin-top:8px;}
  .qr{display:flex;justify-content:center;margin-top:14px;}
  .qr img,.qr canvas{width:170px!important;height:170px!important;border:8px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .btn{display:flex;width:100%;align-items:center;justify-content:center;gap:9px;margin-top:14px;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;text-indent:.22em;color:#fff;background:var(--green-deep);border:1px solid var(--green-deep);padding:14px 16px;cursor:pointer;text-decoration:none;transition:.3s;}
  .btn:hover{background:transparent;color:var(--green-deep);}
  .btn.copied{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;}
  .btn.line{background:transparent;color:var(--ink);border-color:var(--ink);}
  .btn.line:hover{background:var(--ink);color:var(--paper);}
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .m-key{font-size:12px;margin-top:10px;color:var(--ink-soft);word-break:break-all;}
  .m-soon{font-family:'Bodoni Moda',serif;font-style:italic;font-size:15px;color:var(--green-deep);margin-top:22px;line-height:1.6;}

  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>

<script src="assets/js/qrcode.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   ⚙️  CONFIGURAÇÃO — edite somente este bloco
   ════════════════════════════════════════════════════════════ */
const CONFIG = {
  noivos: 'Clara & Daniel',

  // Pix que recebe os presentes. Enquanto a chave estiver vazia, o botão
  // "Presentear" mostra um aviso de "em breve".
  pixChave:  '',              // CPF, e-mail, telefone (+5585...) ou chave aleatória
  pixNome:   '',              // nome do titular da conta (como no banco)
  pixCidade: 'FORTALEZA',

  // WhatsApp para o convidado avisar que presenteou (opcional; só números com DDI+DDD)
  whatsapp: '',
};

// img: arquivo em assets/presentes/ (null = sem foto) · cat: 'casa' ou 'fun'
const PRESENTES = [
  ['Máquina lava e seca', 3500.00, 'lava-e-seca', 'casa'],
  ['Geladeira', 4600.00, 'geladeira', 'casa'],
  ['Fogão', 1900.00, null, 'casa'],

  ['Air fryer', 500.00, 'air-fryer', 'casa'],
  ['Micro-ondas', 476.31, 'micro-ondas', 'casa'],
  ['Lava-louças', 2100.00, 'lava-louca', 'casa'],
  ['Jogo de jantar de cerâmica', 657.48, 'jogo-jantar', 'casa'],
  ['Alexa', 449.10, 'alexa', 'casa'],
  ['Liquidificador', 250.00, 'liquidificador', 'casa'],

  ['Aspirador robô', 1199.00, 'aspirador-robo', 'casa'],

  ['Faqueiro completo', 368.00, 'faqueiro', 'casa'],
  ['Máquina de sorvete Ninja', 1799.10, 'sorveteira-ninja', 'casa'],
  ['Ar-condicionado', 2000.00, 'ar-condicionado', 'casa'],

  ['Kit churrasco', 390.00, 'kit-churrasco', 'casa'],
  ['Kit streamings', 580.00, 'streamings', 'casa'],
  ['Smart TV 4K 50" LG', 2219.00, 'smart-tv', 'casa'],
  ['Sofá', 1895.00, 'sofa', 'casa'],
  ['Poltrona', 600.00, 'poltrona', 'casa'],
  ['Jogo de xícaras de porcelana', 285.00, 'xicaras', 'casa'],
  ['Vale-presente', 450.00, 'vale-presente', 'casa'],
  ['Vale-presente', 620.00, 'vale-presente', 'casa'],
  ['Kit vinho e fondue', 386.00, 'vinho-fondue', 'casa'],
  ['Rack para TV', 1000.00, 'rack-tv', 'casa'],
  ['Multiprocessador', 420.00, 'multiprocessador', 'casa'],
  ['Jantar romântico para os noivos', 700.00, 'jantar-romantico', 'fun'],
  ['Kit toalhas Buddemeyer', 380.00, 'toalhas', 'casa'],
  ['Só pra dizer que não dei nada', 250.00, 'nao-dei-nada', 'fun'],
  ['Passe pra ser o primeiro a entrar na pista de dança', 290.00, 'pista-de-danca', 'fun'],
  ['Deus tocou no seu coração', 1500.00, 'deus-tocou', 'fun'],
  ['Espaço na mala pra trazer lembrancinha da lua de mel', 300.00, 'espaco-mala', 'fun'],
  ['Jogar o buquê na sua direção', 700.00, 'buque', 'fun'],
  ['Patrocínio oficial da lua de mel', 590.00, 'patrocinio-lua-de-mel', 'fun'],
  ['Livro de receitas para a noiva', 300.00, 'livro-receitas', 'fun'],
  ['Ajude os noivos com o hotel 5 estrelas', 600.00, 'hotel-5-estrelas', 'fun'],
  ['Passeio para os noivos em Bariloche', 350.00, 'bariloche', 'fun'],
  ['Ajude no dia da noiva', 620.00, 'dia-da-noiva', 'fun'],
  ['Convidado não convida', 7000.00, 'convidado-nao-convida', 'fun'],
  ['Ajude os noivos nas parcelas do casamento', 560.00, 'parcelas', 'fun'],
  ['Skin care dos noivos', 290.00, 'skin-care', 'fun'],
  ['Espirro em Bariloche', 380.00, 'espirro-bariloche', 'fun'],
  ['Looks novos para a lua de mel', 450.00, 'looks-lua-de-mel', 'fun'],
  ['Primeiro na fila do buffet', 500.00, 'fila-buffet', 'fun'],
  ['Cueca sexy pra noite de núpcias', 450.00, 'cueca', 'fun'],
];

/* ════════════════════════════════════════════════════════════
   A partir daqui é o funcionamento — não precisa mexer.
   ════════════════════════════════════════════════════════════ */
const items=PRESENTES.map(([nome,valor,img,cat],i)=>({i,nome,valor,img,cat}));
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function picHTML(it,cls){
  if(!it.img) return '<div class="'+cls+' ph"><span class="mono"></span></div>';
  return '<div class="'+cls+(it.cat==='fun'?' cover':'')+'"><img loading="lazy" src="assets/presentes/'+it.img+'.jpg" alt="'+esc(it.nome)+'"></div>';
}

let cat='all',sort='';
function render(){
  let list=items.filter(it=>cat==='all'||it.cat===cat);
  if(sort==='asc')list=list.slice().sort((a,b)=>a.valor-b.valor);
  if(sort==='desc')list=list.slice().sort((a,b)=>b.valor-a.valor);
  document.getElementById('grid').innerHTML=list.map(it=>
    '<article class="card">'+picHTML(it,'pic')+
    '<div class="body"><p class="name">'+esc(it.nome)+'</p><p class="price">'+brl(it.valor)+'</p>'+
    '<button class="give" data-i="'+it.i+'">Presentear</button></div></article>').join('');
}
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  cat=b.dataset.cat;render();
}));
document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;render();});
document.getElementById('grid').addEventListener('click',e=>{
  const b=e.target.closest('.give');if(b)openGift(items[+b.dataset.i]);
});
render();

/* ─── Pix "copia e cola" (BR Code) com o valor do presente ─── */
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v;}
function crc16(s){
  let c=0xFFFF;
  for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?(c<<1)^0x1021:c<<1;c&=0xFFFF;}
  return c.toString(16).toUpperCase().padStart(4,'0');
}
function plain(s,max){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().slice(0,max).trim();}
function pixPayload(valor,desc){
  const acc=tlv('00','br.gov.bcb.pix')+tlv('01',CONFIG.pixChave.trim())+(desc?tlv('02',plain(desc,40)):'');
  const p=tlv('00','01')+tlv('26',acc)+tlv('52','0000')+tlv('53','986')+tlv('54',valor.toFixed(2))+
          tlv('58','BR')+tlv('59',plain(CONFIG.pixNome,25))+tlv('60',plain(CONFIG.pixCidade,15))+tlv('62',tlv('05','***'))+'6304';
  return p+crc16(p);
}

/* ─── Modal ─── */
const modal=document.getElementById('modal');
const icoCopy='<svg viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="12" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M16 8V5.5A1.5 1.5 0 0014.5 4h-9A1.5 1.5 0 004 5.5v9A1.5 1.5 0 005.5 16H8" stroke="currentColor" stroke-width="1.5"/></svg>';
const icoWpp='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2a8.2 8.2 0 01-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 001.9-1.3 2.3 2.3 0 00.2-1.3c-.1-.1-.2-.2-.4-.3z"/></svg>';
function openGift(it){
  document.getElementById('mPic').outerHTML=picHTML(it,'m-pic').replace('class="m-pic','id="mPic" class="m-pic');
  document.getElementById('mName').textContent=it.nome;
  document.getElementById('mPrice').textContent=brl(it.valor);
  const pay=document.getElementById('mPay');
  if(!CONFIG.pixChave||!CONFIG.pixNome){
    pay.innerHTML='<p class="m-soon">Obrigado pelo carinho! Os dados do Pix para presentear serão adicionados em breve.</p>';
  }else{
    const code=pixPayload(it.valor,it.nome);
    let h='<p class="m-step">1 · Pague com Pix</p><p class="m-txt">Copie o código abaixo e cole na opção <strong style="font-weight:400;color:var(--ink)">Pix copia e cola</strong> do seu banco — o valor já vem preenchido.</p>'+
      '<button class="btn" id="copyPix">'+icoCopy+'<span>Copiar código Pix</span></button>'+
      '<div class="qr" id="qr"></div>'+
      '<p class="m-key">Chave Pix: '+esc(CONFIG.pixChave)+'<br>'+esc(CONFIG.pixNome)+'</p>';
    if(CONFIG.whatsapp){
      const msg='Olá, '+CONFIG.noivos+'! 💍 Acabei de enviar o presente "'+it.nome+'" ('+brl(it.valor)+') pela lista. Com carinho, ';
      h+='<p class="m-step">2 · Avise os noivos</p><a class="btn line" target="_blank" rel="noopener" href="https://wa.me/'+CONFIG.whatsapp.replace(/\D/g,'')+'?text='+encodeURIComponent(msg)+'">'+icoWpp+'<span>Enviar recado</span></a>';
    }
    pay.innerHTML=h;
    try{new QRCode(document.getElementById('qr'),{text:code,width:340,height:340,correctLevel:QRCode.CorrectLevel.M});}catch(e){document.getElementById('qr').remove();}
    const btn=document.getElementById('copyPix');const lbl=btn.querySelector('span');
    btn.addEventListener('click',()=>{
      const done=()=>{btn.classList.add('copied');lbl.textContent='Código copiado!';setTimeout(()=>{btn.classList.remove('copied');lbl.textContent='Copiar código Pix';},2200);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(done).catch(()=>fallback(code,done));
      else fallback(code,done);
    });
  }
  modal.classList.add('open');document.body.classList.add('lock');
}
function fallback(text,done){
  const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');
  t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(t);done();
}
function closeModal(){modal.classList.remove('open');document.body.classList.remove('lock');}
document.getElementById('close').addEventListener('click',closeModal);
modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
